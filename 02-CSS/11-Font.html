<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Font</title>
        <style>
            div {
                  border: 3px solid black;  /* add border */
                  font-family: Arial, sans-serif;  /* here sans-serif is backup font if our webpage do not support Arial then it will use sans-serif */
                  font-size: 28px;  
                  font-weight: bold;  /* make text bold */    
            }
        </style>
    </head>
    <body>
        <div> <!-- Div will add styling at some specific part of page -->
            Hello, world! 
        </div>
        Some more text. <!-- This is out of div so styling not applied to it -->
    </body>
</html>
