<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Table</title>
        <style>
            table {
                border: 3px solid blue;
                border-collapse: collapse;  /* to remove double border */
            }
            td, th {
                border: 1px solid black;
                padding: 5px;  /* add space inside border */
            }
            /* if we dont want to style th separately then we can add th with td by using comma */
            /* th {
                border: 1px solid black;
            } */
        </style>
    </head>
    <body>
        <table>
            <!-- Table content goes here -->
             <thead>
                <!-- Table header content goes here -->
                 <tr> <!-- 1st row -->
                    <!-- <th> th table head-->
                    <th>Ocean</th>
                    <th>Average Depth</th>
                    <th>Maximum Depth</th>
                 </tr>
             </thead>
             <tbody>
                <tr> <!-- 2nd row -->
                    <!-- tr table row -->
                     <td>Pacific</td> <!-- td table data -->
                     <td>4,280 m</td>
                     <td>10,911 m</td>
                </tr>
                <tr> <!-- 3rd row -->
                     <td>Atlantic</td> 
                     <td>3,646 m</td>
                     <td>8,486 m</td>
                </tr>
             </tbody>
        </table>
    </body>
</html>
